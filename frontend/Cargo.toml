[package]
name = "frontend"
version = "0.1.0"
authors = ["ASUS"]
edition = "2021"

# Les dépendances (les outils qu'on utilise)
[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["wasm-bindgen"] }
dioxus = { version = "0.7.1", features = ["router"] }
futures-util = "0.3.31"
gloo-dialogs = "0.2.0"
gloo-file = { version = "0.3.0", features = ["futures"] }
gloo-net = "0.6.0"
gloo-storage = "0.3.0"
gloo-timers = "0.3.0"
js-sys = "0.3.85"

# --- NOS AJOUTS POUR LE TCHAT ---
# Pour parler au backend
reqwest = { version = "0.12", features = ["json"] }
# Pour comprendre le JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pour utiliser nos modèles User/Message communs
shared = { path = "../shared" }

# --- NE TOUCHE PAS À ÇA (C'est la config Dioxus) ---
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
