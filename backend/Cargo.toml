[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
mongodb = "2.8"
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors"] }
shared = { path = "../shared" }
tracing-subscriber = "0.3"
argon2 = "0.5"
rand = "0.8"
bcrypt = "0.15"
chrono = "0.4"
jsonwebtoken = "9.3" # Pour créer les tickets d'accès sécurisés
futures-util = "0.3" # Pour split() et StreamExt sur WebSocket
serde_json = "1"
dashmap = "6.1.0"
tracing = "0.1.44"
feed-rs = "1.3"
regex = "1"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "purge_db"
path = "src/bin/purge_db.rs"
